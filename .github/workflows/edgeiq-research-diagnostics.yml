name: EDGEIQ research data diagnostics

on:
  push:
    paths:
      - '.github/workflows/edgeiq-research-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edgeiq-launch-foundation-2026
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect published research completeness
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { buildDefenseRankings } from './src/analytics/defensiveMatchups.ts'
          import { rankNFLDefensiveYards } from './src/analytics/nflDefensiveYards.ts'
          const cache=JSON.parse(readFileSync('data/edgeiq-research-cache.json','utf8'))
          const feed=JSON.parse(readFileSync('public/edgeiq-daily.json','utf8'))
          const completedNFLGame=Object.keys(cache.nfl??{})[0]
          if(completedNFLGame){
            try {
              const response=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event='+completedNFLGame,{signal:AbortSignal.timeout(12000)})
              const source=await response.json()
              console.log('NFL BOXSCORE LABELS:',JSON.stringify((source.boxscore?.players??[]).slice(0,1).flatMap(side=>
                (side.statistics??[]).map(group=>({name:group.name,labels:group.labels,
                  first:group.athletes?.[0]?.stats})))))
            }catch(error){console.log('NFL BOXSCORE PROBE ERROR:',String(error))}
          }
          const rushing=rankNFLDefensiveYards(Object.values(cache.nfl??{}).flatMap(x=>x.rows??[]),'Rushing Yards')
          console.log('REAL NFL RUSH DEFENSE:',JSON.stringify({teams:rushing.length,lowest:rushing[0],highest:rushing.at(-1)}))
          const games=Object.values(cache.nba||{})
          const rows=games.flatMap(x=>x.rows??[])
          const positions={}
          const minCount={}
          for(const row of rows){
            const p=row.position||'MISSING'
            positions[p]=(positions[p]||0)+1
            if(row.minutes>=18)minCount[p]=(minCount[p]||0)+1
          }
          const published=JSON.parse(readFileSync('public/edgeiq-nba-history.json','utf8'))
          const defense=buildDefenseRankings(published.history,'Points',19.5,'over')
          const allProps=feed.boards.NBA?.[0]?.allPicks??[]
          const nflProps=feed.boards.NFL?.[0]?.allPicks??[]
          const summary=picks=>{
            const buckets={}
            for(const pick of picks){const key=pick.category; buckets[key]??={over:0,under:0};buckets[key][pick.direction]++}
            return buckets
          }
          console.log('PUBLISHED NBA ALL PROPS:',JSON.stringify({total:allProps.length,categories:summary(allProps),elite:feed.boards.NBA?.[0]?.picks?.length}))
          const rost=JSON.parse(readFileSync('public/edgeiq-current-rosters.json','utf8'))
          const rosterMislabels=[]
          const cousins=[]
          for(const [sport,boards] of Object.entries(feed.boards)){
            for(const board of boards)for(const pick of [...board.picks,...board.allPicks]){
              if(rost[sport]?.[pick.playerId]?.team!==pick.team)rosterMislabels.push(pick.player+' '+pick.team)
              if(pick.playerId==='14880')cousins.push({team:pick.team,opponent:pick.opponent,category:pick.category})
            }
          }
          console.log('ROSTER VALIDATION:',JSON.stringify({
            verifiedKirk:rost.NFL?.['14880'],mismatches:rosterMislabels.slice(0,5),count:rosterMislabels.length,
            kirkCards:cousins.slice(0,6)
          }))
          if(rosterMislabels.length)process.exitCode=1
          console.log('PUBLISHED NFL ALL PROPS:,JSON.stringify({total:nflProps.length,categories:summary(nflProps),elite:feed.boards.NFL?.[0]?.picks?.length}))
          console.log('REAL POSITION LEADERBOARD:',JSON.stringify(Object.entries(defense.byPosition).map(([position,rows])=>({
            position,defenses:rows.length,example:rows[0]?{team:rows[0].team,hitRate:rows[0].hitRate,sample:rows[0].appearances}:null
          }))))
          console.log('NBA GAMES:',games.length,'NBA ROWS:',rows.length)
          console.log('POSITION DISTRIBUTION:',JSON.stringify(positions))
          console.log('POSITION 18+ MINUTES:',JSON.stringify(minCount))
          console.log('SAMPLE:',JSON.stringify(rows.slice(0,2).map(x=>({position:x.position,team:x.team,minutes:x.minutes,gameId:x.gameId,opponent:x.opponent}))))
          for(const team of ['2','13','18']){
            const url='https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/'+team+'/roster'
            const response=await fetch(url,{signal:AbortSignal.timeout(10000)})
            const data=await response.json()
            const athletes=(data.athletes??[]).flatMap(group=>Array.isArray(group.items)?group.items:[group])
            const distribution={}
            for(const row of athletes){
              const pos=row.position?.abbreviation??'UNKNOWN'
              distribution[pos]=(distribution[pos]||0)+1
            }
            console.log('NBA ROSTER',team,response.status,athletes.length,JSON.stringify(distribution),JSON.stringify(athletes.slice(0,2).map(x=>({id:x.id,name:x.displayName,pos:x.position?.abbreviation}))))
          }
          for(const url of ['https://edgeiqstats.com/edgeiq-daily.json','https://edgeiqstats.com/edgeiq-nba-history.json','https://edgeiqstats.com/edgeiq-current-rosters.json'].map(url=>url+'?updated='+Date.now())) {
            try {
              const response=await fetch(url,{signal:AbortSignal.timeout(15000)})
              const data=await response.text()
              let detail=''
              if(response.ok) {
                try {
                  const parsed=JSON.parse(data)
                  detail='generatedAt='+parsed.generatedAt+' players='+(parsed.players?.length??0)+' nbaBoards='+(parsed.boards?.NBA?.length??0)+' KirkCurrentTeam='+(parsed.NFL?.['14880']?.team??'N/A')
                }catch {detail='invalid JSON'}
              }
              console.log('LIVE WEBSITE:',url,response.status,'bytes='+data.length,detail)
            }catch(error){console.log('LIVE WEBSITE:',url,'ERROR',String(error))}
          }
          try {
            const website=await (await fetch('https://edgeiqstats.com/',{signal:AbortSignal.timeout(10000)})).text()
            const path=website.match(/<script[^>]*src=["']([^"']+)["']/i)?.[1]
            const bundle=path?await (await fetch('https://edgeiqstats.com'+path,{signal:AbortSignal.timeout(15000)})).text():''
            console.log('LIVE INDEX:',website.slice(0,450));console.log('LIVE UI:', 'bundle='+path, 'allPropsControl='+bundle.includes('All Props'), 'nbaComboFilter='+bundle.includes('PRA · PA · PR · AR'), 'nflExpandedProps='+bundle.includes('Passing Completions'), 'rosterValidatedUI='+bundle.includes('edgeiq-current-rosters.json'), 'guardsCopy='+bundle.includes('Guards (G)'),
              'forwardsCopy='+bundle.includes('Forwards (F)'),'hasDailyHistory='+bundle.includes('edgeiq-nba-history.json'), 'rushDefenseTable='+bundle.includes('Rushing yards allowed per game'), 'rushMatchup='+bundle.includes('RUSH YARDS ALLOWED / GAME'))
          }catch(error){console.log('LIVE UI: ERROR',String(error))}
          console.log('TODAY BOARDS:',JSON.stringify(Object.entries(feed.boards).map(([sport,boards])=>({sport,boards:boards.map(b=>({date:b.date,matchupBacked:b.picks.filter(x=>x.defense).length}))}))))
          NODE
