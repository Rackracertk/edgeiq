name: EDGEIQ launch checks and lockfile

on:
  push:
    branches: [edgeiq-launch-foundation-2026]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh npm lockfile for the Supabase SDK
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency lockfile if updated
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock launch dependencies"
            git push origin HEAD:edgeiq-launch-foundation-2026
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/create-checkout/index.ts supabase/functions/manage-billing/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/sports-research/index.ts supabase/functions/refresh-research/index.ts supabase/functions/pro-insights/index.ts
