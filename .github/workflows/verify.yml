name: Verify EDGEIQ build
on:
  push:
    branches: [edgeiq-launch-foundation-2026]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check and build
        run: npm run build
      - name: Unit tests
        run: npm test
