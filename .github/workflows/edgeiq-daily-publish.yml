name: EDGEIQ unattended daily cheat-sheet publisher

on:
  schedule:
    # GitHub schedule is UTC. Covers US pregame mornings, afternoons and evenings.
    # GitHub may delay scheduled runs; the site shows publication freshness.
    # Refresh and republish the expanded NBA/NFL props, including verified NFL tackle, target and TD stats.
    - cron: '15 10,12,14,16,18,20,22,23 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/edgeiq-daily-publish.yml'

permissions:
  contents: write

concurrency:
  group: edgeiq-unattended-cheatsheet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout website deployment branch
        uses: actions/checkout@v4
        with:
          ref: edgeiq-launch-foundation-2026
          fetch-depth: 0
          persist-credentials: true
      - name: Set up current Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect completed game history, recheck injuries, and publish verified slates
        run: node --experimental-strip-types scripts/publish-daily-cheatsheet.mjs
      - name: Publish research and historical cache to website branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/edgeiq-daily.json public/edgeiq-nba-history.json data/edgeiq-research-cache.json
          if git diff --cached --quiet; then
            echo "No updated research to commit"
          else
            git commit -m "data: unattended NBA/NFL research and injury refresh"
            git pull --rebase origin edgeiq-launch-foundation-2026
            git push origin HEAD:edgeiq-launch-foundation-2026
          fi
